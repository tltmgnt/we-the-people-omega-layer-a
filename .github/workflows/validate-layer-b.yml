name: Validate Layer B
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate-layer-b:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: layer-b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m scripts.validate_packet examples/permit/operational-review.json
      - name: Confirm synthetic packet remains blocked
        shell: bash
        run: |
          set +e
          python -m scripts.validate_packet --require-ready examples/permit/operational-review.json
          result=$?
          test "$result" -eq 2
  browser-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: layer-b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save --prefix .local/browser-check playwright@1.62.1
      - run: .local/browser-check/node_modules/.bin/playwright install --with-deps chromium
      - run: node tests/browser-smoke.cjs
        env:
          NODE_PATH: .local/browser-check/node_modules
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-browser-previews
          path: layer-b/.local/portfolio-*.png
          if-no-files-found: ignore
          include-hidden-files: true
