name: Curriculum laboratory
on:
  pull_request:
    paths:
      - 'curriculum/**'
      - '**/*.py'
      - '**/*.json'
      - '**/*.tsx'
      - 'docs/portfolio/TOPOLOGY_CURRICULUM_V2.md'
      - '.github/workflows/curriculum.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: curriculum-${{ github.ref }}
  cancel-in-progress: true
jobs:
  worked-examples:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --only-binary=:all: jsonschema==4.26.0
      - name: Verify worked answers against current source
        run: python curriculum/lab.py --verify
